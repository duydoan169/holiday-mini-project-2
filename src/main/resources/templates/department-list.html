<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Department List</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>

<h2 style="margin: 10px 5px">Department List</h2>
<a th:href="@{/employees}" class="btn btn-secondary" style="margin: 5px 10px 10px">Back to Employees</a>
<br>

<div th:if="${success}" class="alert alert-success" style="margin: 10px" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" style="margin: 10px" th:text="${error}"></div>

<table class="table table-striped table-inverse">
  <thead class="thead-inverse">
  <tr>
    <th class="text-center">ID</th>
    <th>Tên phòng ban</th>
    <th>Địa điểm</th>
    <th class="text-center">Action</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="dept : ${departments}">
    <td class="text-center" th:text="${dept.id}"></td>
    <td th:text="${dept.name}"></td>
    <td th:text="${dept.location}"></td>
    <td class="text-center">
      <form th:action="@{/departments/delete/{id}(id=${dept.id})}" method="post">
        <button type="submit" class="btn btn-danger btn-sm"
                onclick="return confirm('Bạn có chắc muốn xóa phòng ban này?')">
          Xóa
        </button>
      </form>
    </td>
  </tr>
  </tbody>
</table>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
