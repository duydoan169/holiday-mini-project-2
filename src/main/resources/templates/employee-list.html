<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Employee List</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>

<h2 style="margin: 10px 5px">Employee List</h2>
<a th:href="@{/employees/create}" class="btn btn-primary" style="margin: 5px 10px 10px">Add employee</a> <br>
<form style="display: flex; gap: 20px; justify-content: space-between; align-items: center; margin: 0 10px" method="get" th:action="@{/employees}">
  <div style="display: flex; gap: 10px">
    <div>
      <input type="text" th:value="${search}" name="search" placeholder="Search" style="height: 35px; width: 700px">
    </div>
    <select name="sort" style="height: 35px;">
      <option value="name,asc" th:selected="${sortField == 'name' and sortDirection == 'asc'}">Name A-Z</option>
      <option value="name,desc" th:selected="${sortField == 'name' and sortDirection == 'desc'}">Name Z-A</option>
      <option value="age,asc" th:selected="${sortField == 'age' and sortDirection == 'asc'}">Age Ascending</option>
      <option value="age,desc" th:selected="${sortField == 'age' and sortDirection == 'desc'}">Age Descending</option>
    </select>
  </div>
  <button type="submit" class="btn btn-primary">Search</button>
</form>
<br>
<table class="table table-striped table-inverse">
  <thead class="thead-inverse">
  <tr>
    <th class="text-center">ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Avatar</th>
    <th>Status</th>
    <th>Department</th>
  </tr>
  </thead>
  <tbody>
  <tr th:if="${pageable.totalPages != 0}" th:each="emp : ${pageable.content}">
    <td class="text-center" th:text="${emp.id}"></td>
    <td th:text="${emp.name}"></td>
    <td th:text="${emp.age}"></td>
    <td>
      <img th:if="${emp.avatar != null}"
           th:src="${emp.avatar}"
           width="50" height="50"
           style="object-fit: cover; border-radius: 50%"/>
      <span th:if="${emp.avatar == null}">Chưa có ảnh</span>
    </td>
    <td th:text="${emp.status}"></td>
    <td th:text="${emp.department.name}"></td>
  </tr>
  <tr th:if="${pageable.totalPages == 0}">
    <td colspan="6" class="text-center">Không tìm thấy nhân viên nào</td>
  </tr>
  </tbody>
</table>
<nav style="margin: 10px" aria-label="Page navigation" th:if="${pageable.totalPages != 0}">
  <ul class="pagination">
    <li class="page-item" th:classappend="${pageable.isFirst() ? 'disabled' : ''}">
      <a class="page-link" th:href="@{/employees(search=${search}, page=${pageable.number - 1}, size=${pageable.size}, sort=${sortField + ',' + sortDirection})}" aria-label="Previous">
        <span aria-hidden="true">&laquo;</span>
        <span class="sr-only">Previous</span>
      </a>
    </li>

    <li class="page-item"
        th:each="i : ${#numbers.sequence(0, pageable.totalPages - 1)}"
        th:classappend="${i == pageable.number} ? 'active'">
      <a class="page-link"
         th:text="${i + 1}"
         th:href="@{/employees(search=${search}, page=${i}, size=${pageable.size}, sort=${sortField + ',' + sortDirection})}">
      </a>
    </li>

    <li class="page-item" th:classappend="${pageable.isLast() ? 'disabled' : ''}">
      <a class="page-link" th:href="@{/employees(search=${search}, page=${pageable.number + 1}, size=${pageable.size}, sort=${sortField + ',' + sortDirection})}" aria-label="Next">
        <span aria-hidden="true">&raquo;</span>
        <span class="sr-only">Next</span>
      </a>
    </li>
  </ul>
</nav>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
