<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm Nhân Viên</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
<div class="container" style="margin-top: 20px">
    <h4>Thêm Nhân Viên</h4>
    <form th:action="@{/employees/create}" th:object="${employeeDTO}" method="post" enctype="multipart/form-data">

        <div class="form-group">
            <label>Tên</label>
            <input type="text" class="form-control" th:field="*{name}" />
            <span th:if="${#fields.hasErrors('name')}" th:text="${#fields.errors('name')[0]}" class="text-danger"></span>
        </div>

        <div class="form-group">
            <label>Tuổi</label>
            <input type="number" class="form-control" th:field="*{age}" />
            <span th:if="${#fields.hasErrors('age')}" th:text="${#fields.errors('age')[0]}" class="text-danger"></span>
        </div>

        <div class="form-group">
            <label>Trạng thái</label>
            <select class="form-control" th:field="*{status}">
                <option value="ACTIVE">ACTIVE</option>
                <option value="INACTIVE">INACTIVE</option>
            </select>
        </div>

        <div class="form-group">
            <label>Phòng ban</label>
            <select class="form-control" th:field="*{departmentId}">
                <option th:each="dept : ${departments}"
                        th:value="${dept.id}"
                        th:text="${dept.name}">
                </option>
            </select>
            <span th:if="${#fields.hasErrors('departmentId')}" th:text="${#fields.errors('departmentId')[0]}" class="text-danger"></span>
        </div>

        <div class="form-group">
            <label>Ảnh đại diện</label>
            <input type="file" class="form-control" th:field="*{file}" accept="image/*" />
            <span th:if="${#fields.hasErrors('file')}" th:text="${#fields.errors('file')[0]}" class="text-danger"></span>
        </div>

        <a th:href="@{/employees}" class="btn btn-secondary">Quay lại</a>
        <button type="submit" class="btn btn-primary">Thêm</button>

    </form>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
